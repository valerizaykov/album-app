<div class="signup-card">
  <div class="card-title">
    <h1>Add order form</h1>
  </div>
  <form class="form-group" [formGroup]="postForm" (ngSubmit)="onSubmit()">
    title:<input type="text" name="title" placeholder="title" formControlName="title"><br/>
    body:<input type="text" name="body" placeholder="body" formControlName="body"><br/>
    user:<input type="text" name="username" placeholder="username" formControlName="username" readonly><br/>
    <input type="submit" value="Add">
  </form>
</div>
